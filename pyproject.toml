[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commonweal"
version = "0.1.0"
description = "Trusted-federation control plane for pooled LLM inference"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"

dependencies = [
    "pynacl>=1.5",        # X25519 sealed boxes, Ed25519 signing
    "cryptography>=42",   # AES-256-GCM
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# Optional on purpose: the OS keychain is the better home for a member's secret
# keys, but peers and coordinators run on headless servers that have no keychain
# at all. Requiring it would break the deployment this project is for.
keyring = ["keyring>=24"]

[project.scripts]
commonweal = "commonweal.client.cli:main"
commonweal-coordinator = "commonweal.coordinator.__main__:main"
commonweal-peer = "commonweal.peer.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
